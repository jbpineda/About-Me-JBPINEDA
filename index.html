<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8' />
    <title>California high schools</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Winky Rough">
    <link rel="icon" type="image/png" href="./assets/pencil-art.png">
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdn.jsdelivr.net/npm/mapbox-gl-globe-minimap@1.2.0/dist/bundle.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Winky Rough;
        }

        a,
        a:hover,
        a:visited {
            color: #0071bc;
        }

        #map {
            top: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;

            z-index: 0;
            pointer-events: none;
            /* <-- key: map can't steal clicks */
        }

        #story {
            position: relative;
            z-index: 10;
            /* story sits above map */
        }

        #header {
            margin: auto;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        #header h1,
        #header h2,
        #header p {
            margin: 0;
            padding: 2vh 2vw;
            text-align: center;
        }

        #footer {
            width: 100%;
            min-height: 5vh;
            padding-top: 2vh;
            padding-bottom: 2vh;
            text-align: center;
            line-height: 25px;
            font-size: 13px;
            position: relative;
            z-index: 5;
        }

        #features {
            padding-top: 10vh;
            padding-bottom: 10vh;
        }

        .step.hidden {
            opacity: 0.001;
            /* basically invisible */
            visibility: visible;
            /* IMPORTANT: still measurable */
            pointer-events: none;
        }

        .centered {
            width: 50vw;
            margin: 0 auto;
        }

        .lefty {
            width: 33vw;
            margin-left: 5vw;
        }

        .righty {
            width: 33vw;
            margin-left: 62vw;
        }

        .fully {
            width: 100%;
            margin: auto;
        }

        .light {
            color: #444;
            background-image: url(./assets/ruled-paper.jpg);
        }

        .dark {
            color: #fafafa;
            background-color: #444;
        }

        .step {
            padding-bottom: 50vh;
            /* margin-bottom: 10vh; */
            opacity: 0.25;
        }

        .step.active {
            opacity: 0.9;
        }

        .step .chapter {
            padding: 25px 50px;
            line-height: 25px;
            font-size: 13px;
        }

        /* For your school/skills step: make a predictable container */
        #school .chapter {
            box-sizing: border-box;
            max-width: 860px;
            /* ✅ bigger lined paper backdrop */
            margin: 0 auto;
            padding: 28px 28px;
            /* ✅ more breathing room */
            overflow: hidden;
        }

        .step img {
            width: 100%;
        }


        @media (max-width: 750px) {

            .centered,
            .lefty,
            .righty,
            .fully {
                width: 90vw;
                margin: 0 auto;
            }
        }

        #prologue.step {
            padding-bottom: 18vh;
            /* smaller gap before school */
        }


        /* Fix issue on mobile browser where scroll breaks  */
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {
            touch-action: unset;
        }

        #prologue .chapter {
            position: relative;
            /* you already do this in JS, but safe to keep */
            overflow: visible;
            /* allow clip to hang off the paper edge */
        }

        #paperclip-photo {
            position: absolute;
            top: -28px;
            /* negative = hangs off paper edge */
            right: -39px;
            /* negative = hangs off right edge */
            left: auto;

            width: 130px;
            /* tweak to taste */
            height: auto;

            z-index: 200;
            /* above everything */
            cursor: pointer;

            transform: rotate(10deg);
            transform-origin: top right;

            filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .22));
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        #paperclip-photo:hover {
            transform: rotate(7deg) translateY(-3px);
        }

        #paperclip-photo.swiped {
            transform: translateX(260px) rotate(35deg);
            opacity: 0;
        }


        #library-card-photo {
            position: relative;
            z-index: 30;
        }

        /* the lined-paper chapter needs to be the positioning parent */
        #prologue .chapter {
            position: relative;
        }

        /* portrait sits on lined paper, NOT on the card */
        #portrait-photo {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 220px;
            max-width: 42%;
            height: auto;

            z-index: 25;
            /* behind card (30), above paper background */
            transform: rotate(-2deg);
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .25);

            /* NEW: smooth motion for hover + class toggles */
            transition: transform 600ms ease, box-shadow 600ms ease;
            will-change: transform;
        }

        /* on hover = lift a little */
        #portrait-photo:hover {
            transform: rotate(0deg) translateY(-8px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, .28);
        }

        /* rotated / swiped state */
        #portrait-photo.rotated {
            transform: rotate(-45deg) translateX(20px) translateY(-20px);
        }

        /* ---- Friendly “wave hello” hint animation ---- */
        @keyframes waveHello {
            0% {
                transform: rotate(-2deg) translateY(0);
            }

            20% {
                transform: rotate(2deg) translateY(-6px);
            }

            40% {
                transform: rotate(-4deg) translateY(-10px);
            }

            60% {
                transform: rotate(3deg) translateY(-8px);
            }

            80% {
                transform: rotate(-2deg) translateY(-4px);
            }

            100% {
                transform: rotate(-2deg) translateY(0);
            }
        }

        #portrait-photo.hint {
            animation: waveHello 1.6s cubic-bezier(.22, .61, .36, 1);
        }


        /* --- Prologue paper stack container --- */
        /* Stack establishes positioning context */
        #prologue-stack {
            position: relative;
            /* was sticky */
            max-width: 720px;
            margin: 0 auto;
        }


        /* Library card ALWAYS above the papers */
        #library-card-photo {
            position: relative;
            z-index: 30;
            display: block;
            width: 100%;
        }

        #school-paper {
            z-index: 20;
        }

        #skills-paper {
            z-index: 15;
        }

        #portrait-photo {
            z-index: 80 !important;
        }

        /* === Skills icons (refined, vertical, consistent) === */
        .skills {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-top: 16px;
        }

        .skill {
            display: grid;
            justify-items: center;
            gap: 6px;
        }

        /* uniform icon container */
        .skill .icon {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: rgba(0, 0, 0, .04);
            border: 1px solid rgba(0, 0, 0, .08);
        }

        /* normalize ALL logos */
        .skill img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            opacity: 0.9;
            display: block;
        }

        /* label (clean + subtle) */
        .skill span {
            font-size: 12px;
            padding: 0 3px;
            font-style: italic;
            opacity: 0.6;
            transition: opacity .2s ease;
        }

        /* optional hover emphasis */
        .skill:hover span {
            opacity: 1;
        }


        /* split layout that NEVER overflows */
        .split-wrap {
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
            /* left narrower, right wider */
            gap: 16px;
            align-items: start;
            width: 100%;
        }

        /* CRITICAL: allows the cards to actually shrink within grid */
        .split-wrap>* {
            min-width: 0;
        }

        .paper-card.short {
            min-height: 52vh;
        }

        .paper-card.tall {
            min-height: 70vh;
        }

        .paper-card {
            box-sizing: border-box;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            /* keeps content inside */

            background: #faf8f3;
            /* ✅ paper */
            border-radius: 10px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, .18);
            padding: 18px;
            /* ✅ spacing inside card */
        }

        @media (max-width: 900px) {
            .split-wrap {
                grid-template-columns: 1fr;
            }
        }

        @keyframes icon-shake {
            0% {
                transform: translateX(0) rotate(0deg);
            }

            20% {
                transform: translateX(-3px) rotate(-2deg);
            }

            /* was -2px */
            40% {
                transform: translateX(3px) rotate(2deg);
            }

            /* was 2px */
            60% {
                transform: translateX(-2px) rotate(-1deg);
            }

            /* was -1px */
            80% {
                transform: translateX(2px) rotate(1deg);
            }

            /* was 1px */
            100% {
                transform: translateX(0) rotate(0deg);
            }
        }

        /* Shake the icon boxes once when school becomes active */
        #school.step.active .skill .icon {
            animation: icon-shake 520ms ease 1;
        }

        /* Stagger so they don’t shake in sync */
        #school.step.active .skill:nth-child(1) .icon {
            animation-delay: 0ms;
        }

        #school.step.active .skill:nth-child(2) .icon {
            animation-delay: 90ms;
        }

        #school.step.active .skill:nth-child(3) .icon {
            animation-delay: 180ms;
        }

        #school.step.active .skill:nth-child(4) .icon {
            animation-delay: 270ms;
        }

        /* Slightly nudge R logo left to visually center it */
        #school .skill:nth-child(3) img {
            transform: translateX(-2px);
        }


        .experience-list {
            list-style: none;
            padding: 0;
            margin: 12px 0 0;
            font-style: italic;
            opacity: 0.85;
        }

        .experience-list li {
            margin-bottom: 6px;
            padding-left: 14px;
            position: relative;
        }

        .experience-list li::before {
            content: "—";
            position: absolute;
            left: 0;
            opacity: 0.5;
        }

        .edu-card h3,
        .edu-card p {
            margin: 0;
        }

        .edu-kicker {
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            opacity: .75;
        }

        .edu-dates {
            font-size: 12px;
            font-style: italic;
            opacity: .75;
            white-space: nowrap;
            /* ← prevents line break */
        }

        .edu-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 0 0 6px;
            /* smaller than 10px */
        }

        .edu-school {
            font-size: 16px;
            font-weight: 650;
            margin: 0;
            /* remove extra gap */
            line-height: 1.25;
        }

        .edu-major {
            font-size: 13px;
            /* make it smaller than school */
            font-weight: 500;
            margin: 2px 0 0;
            /* tiny, intentional */
            opacity: .9;
        }

        .edu-coursework {
            margin: 10px 0 0;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, .10);
            line-height: 1.35;

            padding-bottom: 10px;
            /* 👈 extra room before badges */
        }

        .edu-degree .dot {
            opacity: .5;
            padding: 0 6px;
        }

        .edu-badges {
            margin-top: 8px;
            /* 👈 separates from coursework */
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .06);
            border: 1px solid rgba(0, 0, 0, .10);
            line-height: 1.2;
            overflow-wrap: anywhere;
            /* breaks long runs */
            word-break: break-word;
            max-width: 100%;
            white-space: normal;
        }

        .edu-seal {
            width: 165px;
            /* bigger */
            max-width: 55%;
            height: auto;
            display: block;

            margin: 2px auto 8px;
            /* still basically centered */
            transform: translateX(-14px);
            /* 👈 nudge left */
        }

        .chapter-subtitle {
            display: block;
            font-size: 18px;
            /* EXACT match to h3 */
            font-weight: 600;
            /* EXACT match to h3 */
            line-height: 1.25;
            margin-top: 6px;
        }

        /* STORY-MODE styling just for PHHS */
        #phhs .chapter {
            max-width: 720px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        /* a distinct “paper” container */
        .phhs-story {
            background: rgba(250, 248, 243, 0.92);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.14);
            padding: 22px 20px;
            position: relative;
            overflow: hidden;
        }

        /* Framing line above genre */
        #phhs .phhs-genre-frame {
            margin-top: 14px;
            /* space from the lede */
            margin-bottom: 6px;
            /* tight to genre */
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            opacity: .65;
        }

        /* subtle editorial edge */
        .phhs-story::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 10px;
            height: 100%;
            background: rgba(0, 0, 0, 0.06);
        }

        /* small “mode switch” label */
        .phhs-kicker {
            font-size: 12px;
            letter-spacing: .10em;
            text-transform: uppercase;
            opacity: 0.70;
            margin-bottom: 10px;
        }

        /* the two-line thesis */
        .phhs-lede {
            font-size: 18px;
            line-height: 1.35;
            font-style: italic;
            margin: 0 0 14px;
        }

        /* the reveal */
        .phhs-genre {
            font-size: 34px;
            font-weight: 750;
            letter-spacing: .04em;
            margin: 6px 0 10px;
        }

        /* PHHS as a “stamp” */
        .phhs-tag {
            display: inline-block;
            margin-top: 2px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.10);
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* toggle button */
        .phhs-toggle {
            margin-top: 14px;
            background: rgba(46, 125, 50, 0.08);
            /* soft green wash */
            border: 1px solid rgba(46, 125, 50, 0.35);
            border-radius: 999px;
            padding: 8px 14px 8px 12px;
            cursor: pointer;

            font-family: inherit;
            font-size: 13px;
            color: #2e7d32;
            /* deep green */

            display: inline-flex;
            align-items: center;
            gap: 8px;

            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .phhs-toggle:hover {
            background: rgba(46, 125, 50, 0.14);
            border-color: rgba(46, 125, 50, 0.55);
        }

        .phhs-toggle::before {
            content: "";
            width: 0;
            height: 0;

            border-left: 6px solid #2e7d32;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;

            transition: transform 0.25s ease;
        }

        .phhs-toggle[aria-expanded="true"]::before {
            transform: rotate(90deg);
        }


        /* shelf reveal */
        .phhs-shelf {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(0, 0, 0, 0.10);
        }

        .shelf-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            align-items: start;
        }

        .shelf-grid img {
            aspect-ratio: 2 / 3;
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .shelf-caption {
            margin: 10px 0 0;
            font-size: 12px;
            opacity: 0.75;
            font-style: italic;
        }

        /* ===== Animations: trigger when step becomes active ===== */
        #phhs.step .phhs-story {
            transform: translateY(14px);
            opacity: 0;
            transition: transform 700ms ease, opacity 700ms ease;
        }

        #phhs.step.active .phhs-story {
            transform: translateY(0);
            opacity: 1;
        }

        #phhs.step .phhs-genre {
            transform: translateY(8px);
            opacity: 0;
            transition: transform 700ms ease 120ms, opacity 700ms ease 120ms;
        }

        #phhs.step.active .phhs-genre {
            transform: translateY(0);
            opacity: 1;
        }

        /* ===== Reading Glade: “alive” album moment ===== */

        #reading-glade .chapter {
            max-width: 720px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        /* paper-like container */
        .glade-story {
            background: rgba(250, 248, 243, 0.92);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.14);
            padding: 22px 20px;
            position: relative;
            overflow: hidden;
        }

        /* subtle left editorial edge */
        .glade-story::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 10px;
            height: 100%;
            background: rgba(0, 0, 0, 0.06);
        }

        /* soft “sunlight” glow */
        .glade-story::after {
            content: "";
            position: absolute;
            right: -120px;
            top: -120px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 238, 190, 0.55), rgba(255, 238, 190, 0.0) 60%);
            pointer-events: none;
            filter: blur(2px);
        }

        .glade-kicker {
            font-size: 12px;
            letter-spacing: .10em;
            text-transform: uppercase;
            opacity: 0.70;
            margin-bottom: 10px;
        }

        .glade-lede {
            font-size: 18px;
            line-height: 1.35;
            font-style: italic;
            margin: 0 0 14px;
        }

        /* layout */
        .glade-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            align-items: start;
        }

        @media (max-width: 650px) {
            .glade-grid {
                grid-template-columns: 1fr;
            }
        }

        /* album card */
        .album {
            margin: 0;
            display: grid;
            gap: 8px;
            justify-items: center;
        }

        /* SQUARE FRAME + crop */
        .album-frame {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1 / 1;
            /* ✅ square */
            border-radius: 14px;
            overflow: hidden;
            /* ✅ crop overflow */
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(0, 0, 0, 0.10);
            background: rgba(255, 255, 255, 0.6);
            position: relative;
        }

        /* album cover itself */
        .album-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* ✅ crop to square */
            object-position: center;
            /* ✅ center crop */
            display: block;
            transform: scale(1.06);
            /* ✅ “fill” the frame slightly */
        }

        /* subtle gloss highlight */
        .album-frame::after {
            content: "";
            position: absolute;
            inset: -40% -60%;
            transform: rotate(20deg);
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.0), rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.0));
            opacity: 0.35;
            pointer-events: none;
        }

        /* captions */
        .album-cap {
            font-size: 12px;
            opacity: 0.75;
            font-style: italic;
        }

        /* ===== Motion: breathe + micro-wobble ===== */

        @keyframes breathe {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
            }

            50% {
                transform: translateY(-6px) rotate(-0.6deg) scale(1.015);
            }

            100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
        }

        @keyframes wobble {
            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(0.7deg);
            }

            70% {
                transform: rotate(-0.7deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        /* Start hidden, then animate in when step is active */
        #reading-glade.step .glade-story {
            transform: translateY(14px);
            opacity: 0;
            transition: transform 700ms ease, opacity 700ms ease;
        }

        #reading-glade.step.active .glade-story {
            transform: translateY(0);
            opacity: 1;
        }

        /* Albums animate only when active */
        #reading-glade.step.active .album-frame {
            animation: breathe 3.8s ease-in-out infinite;
        }

        #reading-glade.step.active .album-a .album-frame {
            animation-duration: 4.1s;
        }

        #reading-glade.step.active .album-b .album-frame {
            animation-duration: 3.6s;
            animation-delay: 120ms;
            /* slight offset so they don’t sync */
        }

        /* Add a tiny extra wobble sometimes */
        #reading-glade.step.active .album-frame:hover {
            animation: breathe 3.2s ease-in-out infinite, wobble 0.7s ease-in-out;
        }


        /* Caption */
        #reading-glade .shelf-caption {
            margin: 10px 0 0;
            font-size: 12px;
            opacity: 0.75;
            font-style: italic;
        }

        /* ===== Animations ===== */

        /* quick shake once (arrival) */
        @keyframes album-shake {
            0% {
                transform: rotate(0deg) translateX(0);
            }

            20% {
                transform: rotate(-1.2deg) translateX(-2px);
            }

            40% {
                transform: rotate(1.2deg) translateX(2px);
            }

            60% {
                transform: rotate(-0.8deg) translateX(-1px);
            }

            80% {
                transform: rotate(0.8deg) translateX(1px);
            }

            100% {
                transform: rotate(0deg) translateX(0);
            }
        }

        /* slow breathe loop (after shake) */
        @keyframes album-breathe {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.018);
            }

            100% {
                transform: scale(1);
            }
        }

        /* When chapter becomes active:
   - shake once quickly
   - then breathe forever
*/
        #reading-glade.step.active .album-grid img {
            animation:
                album-shake 520ms ease 120ms 1,

        /* ===== PHHS: SVG book stack overlay (readable + not emoji) ===== */
        #map-bookstack {
            position: absolute;

            height: 78px;
            pointer-events: none;
            z-index: 6;
            transform-origin: 50% 92%;
            filter: drop-shadow(0 18px 16px rgba(0, 0, 0, .22));
        }

        #map-bookstack svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* keep your beloved vibe */
        @keyframes stackDrop {
            0% {
                transform: translate3d(0, -460px, 0) rotate(-8deg) scale(0.96);
                opacity: 0;
            }

            65% {
                transform: translate3d(0, 0, 0) rotate(2deg) scale(1);
                opacity: 1;
            }

            78% {
                transform: translate3d(0, -16px, 0) rotate(-1deg) scale(1);
            }

            90% {
                transform: translate3d(0, 0, 0) rotate(1deg) scale(1);
            }

            100% {
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
            }
        }

        @keyframes stackBreathe {

            0%,
            100% {
                transform: rotate(-2deg) translateY(0);
            }

            50% {
                transform: rotate(-2deg) translateY(-2px);
            }
        }

        /* ===== PHHS: extras (squiggle + pulse) ===== */
        #map-bookstack .phhs-squiggle {
            position: absolute;
            left: 50%;
            top: 64px;
            /* starts under the books */
            width: 56px;
            height: 140px;
            /* how far it “reaches” toward the ground */
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
        }

        #map-bookstack .phhs-squiggle svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes squiggleDrop {
            0% {
                transform: translateX(-50%) translateY(-40px);
                opacity: 0;
            }

            40% {
                opacity: 1;
            }

            100% {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* pulse point on the ground */
        #map-bookstack .phhs-pulse {
            position: absolute;
            left: 50%;
            top: 205px;
            /* aligns with “ground” below; tweak if needed */
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: translateX(-50%);
            background: rgba(111, 168, 220, .75);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes pulsePop {
            0% {
                transform: translateX(-50%) scale(.6);
                opacity: 0;
            }

            25% {
                opacity: 1;
            }

            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

        @keyframes pulseRing {
            0% {
                box-shadow: 0 0 0 0 rgba(111, 168, 220, .35);
            }

            100% {
                box-shadow: 0 0 0 18px rgba(111, 168, 220, 0);
            }
        }

        /* Turn them on ONLY when .is-on is applied */
        #map-bookstack.is-on .phhs-squiggle {
            animation: squiggleDrop 900ms cubic-bezier(.16, .84, .22, 1) 900ms both;
        }

        #map-bookstack.is-on .phhs-pulse {
            animation:
                pulsePop 420ms ease 1600ms both,
                pulseRing 1400ms ease-out 1750ms infinite;
        }


        #map-bookstack.is-dropping {
            animation: stackDrop 2200ms cubic-bezier(.16, .84, .22, 1) both;
        }

        #map-bookstack.is-dropping .stack {
            animation: stackBreathe 3200ms ease-in-out 2300ms infinite;
            transform-origin: 50% 85%;
        }

        /* ensure the main stack svg is above the trail */
        #map-bookstack>svg {
            position: relative;
            z-index: 2;
        }

        /* trail sits behind */
        #map-bookstack .trail {
            position: absolute;
            left: 50%;
            top: 58px;
            /* start under the books */
            transform: translateX(-50%);
            width: 86px;
            height: 170px;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
        }

        #map-bookstack.is-on .trail {
            opacity: 1;
        }

        #map-bookstack .trail path {
            fill: none;
            stroke: rgba(35, 35, 35, .78);
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-dasharray: 1.5 7;
            stroke-dashoffset: 110;
        }

        @keyframes trailDraw {
            from {
                stroke-dashoffset: 110;
                opacity: 0;
            }

            to {
                stroke-dashoffset: 0;
                opacity: 1;
            }
        }

        #map-bookstack.is-on .trail path {
            animation: trailDraw 900ms ease 650ms both;
        }

        #map-bookstack .trail-dot {
            position: absolute;
            left: 50%;
            bottom: -6px;
            width: 10px;
            height: 10px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: rgba(111, 168, 220, .9);
            border: 2px solid rgba(35, 35, 35, .82);
            z-index: 1;
            opacity: 0;
        }

        #map-bookstack.is-on .trail-dot {
            opacity: 1;
        }

        #map-bookstack .trail-dot::after {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 999px;
            border: 2px solid rgba(111, 168, 220, .45);
            opacity: 0;
        }

        @keyframes dotPulse {

        }

        #map-bookstack.is-on .trail-dot::after {
            animation: dotPulse 1600ms ease-in-out 1300ms infinite;
        }

        #map-bookstack.is-on .stack {
            animation: stackBreathe 3200ms ease-in-out 2300ms infinite;
            transform-origin: 50% 85%;
        }

            position: absolute;
            right: 10px;
            top: 10px;
            width: 26px;
            height: 26px;
            opacity: .85;
        }

        /* drop-in like your pin/book */
        @keyframes ritualDrop {
            0% {
                transform: translate3d(0, -460px, 0) rotate(-6deg) scale(.98);
                opacity: 0;
            }

            70% {
                transform: translate3d(0, 0, 0) rotate(2deg) scale(1);
                opacity: 1;
            }

            86% {
                transform: translate3d(0, -12px, 0) rotate(-1deg) scale(1);
            }

            100% {
                transform: translate3d(0, 0, 0) rotate(-2deg) scale(1);
            }
        }

        #map-ritual.is-dropping {
            animation: ritualDrop 2200ms cubic-bezier(.16, .84, .22, 1) both;
        }

        /* ===== Sound field pulse (simple + legible) ===== */
        #map-sound {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            pointer-events: none;
            z-index: 6;
            transform: translate(-50%, -50%);
        }

        #map-sound::before,
        #map-sound::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 999px;
            border: 2px solid rgba(111, 168, 220, 0.75);
            opacity: 0;
        }

        @keyframes pulseRing {
            0% {
                transform: scale(.4);
                opacity: 0;
            }

            20% {
                opacity: .75;
            }

            100% {
                transform: scale(3.2);
                opacity: 0;
            }
        }

        #map-sound.is-on::before {
            animation: pulseRing 1800ms ease-out 200ms infinite;
        }

        #map-sound.is-on::after {
            animation: pulseRing 1800ms ease-out 900ms infinite;
        }

        /* ===== Pro tabs: give more horizontal room ===== */
        #professional-chapter .pro-tabs {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            /* 2-wide = readable names */
        }

        /* On large screens, return to 4 */
        @media (min-width: 1100px) {
            #professional-chapter .pro-tabs {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        /* allow the text column to actually expand */
        #professional-chapter .pro-tabtext {
            gap: 3px;
            min-width: 0;
        }

        /* company name should NOT truncate */
        #professional-chapter .pro-co {
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
            line-height: 1.15;
        }

        /* role CAN truncate */
        #professional-chapter .pro-role {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #map-newspaper {
            position: absolute;
            z-index: 40;
            width: 140px;
            pointer-events: auto;
            transform-origin: 50% 50%;

            /* tune knobs */
            --paper-rise: 170px;
            /* how high the newspaper floats above the dot anchor */
            --lift: -8px;

            /* NEW: squiggle length (shorten ~1cm by reducing this ~38px) */
            --squiggle-len: 102px;
            /* if old was ~140px, 102px ≈ 1cm shorter */
        }

        /* the newspaper SVG floats ABOVE the pulse anchor */
        #map-newspaper>svg {
            transform: translateY(calc(-1 * var(--paper-rise)));
            transform-origin: 50% 100%;
        }

        /* squiggle attaches under the paper and ends at the pulse */
        #map-newspaper {
            --paper-rise: 170px;
            --squiggle-len: 92px;
            /* <-- shorten this */
            --squiggle-cut: 18px;
            /* <-- extra "trim from bottom" */
        }

        /* squiggle connects from paper down toward the dot */
        #map-newspaper .phhs-squiggle {
            position: absolute;
            left: 50%;
            top: calc(50% - var(--paper-rise) + 52px);
            width: 56px;

            /* container shorter */
            height: var(--squiggle-len);

            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;

            /* KEY: crop anything that would extend */
            overflow: hidden;
        }

        /* shift the SVG up so the bottom gets cropped (shorter tail) */
        #map-newspaper .phhs-squiggle svg {
            width: 100%;
            height: calc(var(--squiggle-len) + var(--squiggle-cut));
            display: block;
            transform: translateY(calc(-1 * var(--squiggle-cut)));
        }


        /* pulse meets the END of the squiggle */
        #map-newspaper .phhs-pulse {
            position: absolute;
            left: 50%;
            top: calc((50% - var(--paper-rise) + 52px) + var(--squiggle-len));
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(111, 168, 220, .75);
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
        }

        /* hover: lift ONLY the paper (not the dot) */
        #map-newspaper:hover>svg {
            transform: translateY(calc(-1 * var(--paper-rise) + var(--lift)));
        }

        /* animate only when turned on */
        #map-newspaper.is-on .phhs-squiggle {
            animation: squiggleDrop 900ms cubic-bezier(.16, .84, .22, 1) 900ms both;
        }

        #map-newspaper.is-on .phhs-pulse {
            animation:

        }

        /* Footer signature — matches handwritten header style */
        .footer-signature {
            font-family: 'Cedarville Cursive', cursive;

                    transparent);
            margin-top: -2px;
            filter: blur(4px);
        }

            const mapLayer = map.getLayer(layer);
            if (!mapLayer) {
                console.warn('Layer not found:', layer);
                return null;
            }
            return layerTypes[mapLayer.type];

        function setLayerOpacity(layer) {
            // ✅ Guard: skip bad entries (prevents "IDs can't be empty")
            if (!layer || !layer.layer || typeof layer.layer !== 'string' || layer.layer.trim() === '') {
                console.warn('Skipping invalid layer opacity entry:', layer);
                return;

            const mapLayer = map.getLayer(layer.layer);
            if (!mapLayer) {
                console.warn('Layer not found:', layer.layer);
                return;

            if (!paintProps) return;

            paintProps.forEach(function (prop) {
                let options = {};
                if (layer.duration) {
                    options = { duration: layer.duration };
                    map.setPaintProperty(layer.layer, prop + "-transition", options);

                map.setPaintProperty(layer.layer, prop, layer.opacity, options);

                    btn.classList.toggle('is-active', active);
                    btn.setAttribute('aria-selected', String(active));

                    if (!cap) return;
                    cap.textContent = mode === 'craft'

                        : (tile.getAttribute('data-taste') || '');
                });

            function openDrawerFor(tile) {
                if (!drawer || !tile) return;

                const titleEl = tile.querySelector('.tile-title');
                const title = titleEl ? titleEl.textContent.trim() : 'Notes';

                drawerTitle.textContent = title;
                drawerTaste.textContent = tile.getAttribute('data-taste') || '';
                drawerCraft.textContent = tile.getAttribute('data-craft') || '';
                drawerDailycal.textContent = tile.getAttribute('data-dailycal') || '';

                drawer.hidden = false;

            function closeDrawer() {
                if (!drawer) return;

                        {
                            duration: 2500,
                            easing: 'cubic-bezier(.16,.84,.22,1)',
                            fill: 'both'
                        }
                    );

                }

                if (chapter.id === 'phhs') {
                    // ensure we drop after the map reaches the chapter view
                    map.once('moveend', () => dropBookStackAt(chapter.location.center));

                    // if for any reason moveend doesn't fire (rare), still place once:
                    setTimeout(() => dropBookStackAt(chapter.location.center), 400);
                }

                if (chapter.id === 'reading-glade') {
                    map.once('moveend', () => mountGladeOverlays(chapter.location.center));
                    setTimeout(() => mountGladeOverlays(chapter.location.center), 450);
                }

            })
            .onStepExit(response => {
                var chapter = config.chapters.find(chap => chap.id === response.element.id);
                response.element.classList.remove('active');
                if (chapter.onChapterExit.length > 0) {
                    chapter.onChapterExit.forEach(setLayerOpacity);
                }
                // Remove pin when exiting "Where I'm From"
                if (chapter.id === 'where-im-from') {
                    if (sdMarker) sdMarker.remove();
                }
                if (chapter.id === 'phhs') {
                    removeBook();
                }

                if (chapter.id === 'reading-glade') {
                    unmountGladeOverlays();
                }
                if (chapter.id === "learning-to-publish") {
                    removeNewspaper();
                }


            });


        if (config.auto) {
            document.querySelectorAll('[data-scrollama-index="0"]')[0].scrollIntoView();
        }

        // --- Paperclip swipe interaction ---
        document.addEventListener('click', function (e) {
            if (e.target.id === 'paperclip-photo') {
                e.target.classList.add('swiped');
            }

        });


    </script>

</body>

</html>
